<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SD Prompt Viewer</title>
    <!-- Use Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Custom Title Bar -->
    <div class="title-bar">
      <div class="title-text">SD Prompt Viewer</div>
    </div>

    <div class="app-container">
      <!-- Left Panel: Image & Drop Zone -->
      <div class="image-panel" id="drop-zone">
        <div class="empty-state" id="empty-state">
          <div class="icon-box">
            <svg
              width="48"
              height="48"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </div>
          <h3>Drag & Drop PNG</h3>
          <p>or click to select</p>
          <input type="file" id="file-input" accept="image/png" hidden />
        </div>
        <div class="image-preview hidden" id="image-preview-container">
          <img id="preview-img" src="" alt="Preview" />
          <div class="file-name" id="file-name">filename.png</div>
        </div>
      </div>

      <!-- Right Panel: Metadata -->
      <div class="metadata-panel">
        <div class="header">
          <h2>Generation Data</h2>
          <div class="header-controls">
            <button class="btn-icon" id="btn-reset" title="Reset All">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"
                ></path>
                <path d="M21 3v5h-5"></path>
                <path
                  d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"
                ></path>
                <path d="M8 16H3v5"></path>
              </svg>
            </button>
            <div class="help-container">
              <svg
                class="help-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
              <div class="tooltip">
                <p>
                  <strong>Rendered:</strong> Final prompt used for generation
                  (wildcards resolved).
                </p>
                <p>
                  <strong>Source:</strong> Original input with dynamic
                  tags/templates (Specialized for ComfyUI).
                </p>
              </div>
            </div>
            <select
              id="prompt-mode-selector"
              class="mode-selector"
              title="Switch Prompt View"
            >
              <option value="rendered">Rendered</option>
              <option value="source">Source</option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label>
            <span>Positive Prompt</span>
            <button class="btn-copy" id="btn-copy-positive">Copy</button>
          </label>
          <div class="textarea-wrapper">
            <textarea
              id="positive-prompt"
              readonly
              placeholder="Positive prompt will appear here..."
            ></textarea>
          </div>
        </div>

        <div class="field-group">
          <label>
            <span>Negative Prompt</span>
            <button class="btn-copy" id="btn-copy-negative">Copy</button>
          </label>
          <div class="textarea-wrapper">
            <textarea
              id="negative-prompt"
              readonly
              placeholder="Negative prompt will appear here..."
            ></textarea>
          </div>
        </div>

        <div class="field-group">
          <label>
            <span>Attributes</span>
            <button
              class="btn-copy-sm"
              id="btn-copy-attributes"
              title="Copy Attributes"
            >
              Copy
            </button>
          </label>
          <div class="attributes-list" id="attributes-list">
            <!-- Dynamic Attributes like Steps: 20, Sampler: Euler a ... -->
            <div class="attr-row placeholder">No image loaded</div>
          </div>
        </div>

        <div class="field-group full-raw">
          <label>Raw Data</label>
          <textarea id="raw-data" readonly placeholder="Raw metadata will appear here..."></textarea>
        </div>
      </div>
    </div>

    <!-- Using ExifReader from node_modules might require require() in renderer if nodeIntegration=false?

         User agreed to proceed. I already wrote main.js with nodeIntegration: false.
         I can assume I will implement the logic in `renderer.js` and might fail to `require('exifreader')` without a bundler.
         
         Correction: I'll include `node_modules/exifreader/dist/exif-reader.js` via script tag?

         OR: I can use the 'exifreader' file path directly if I can find where it is.
         
         Let's try to stick to "Rich Aesthetics" first. Logic comes in renderer.js.
    -->
    <script src="renderer.js"></script>
  </body>
</html>
